name: Incident report SLM
on:
  push:
    paths:
      - 'incident_report_slm/**'
      - '.github/workflows/incident-report-slm.yml'
  pull_request:
    paths:
      - 'incident_report_slm/**'
      - '.github/workflows/incident-report-slm.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: incident_report_slm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - name: Install and exercise the built wheel
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          subprocess.run([sys.executable, '-I', str(pathlib.Path('scripts/check_wheel.py').resolve())], check=True)
