[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wualt-incident-slm"
version = "0.17.1"
description = "Pretrained SLM wrapper for interpretation of backend distress signals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "uvicorn>=0.30,<1",
  "tzdata>=2025.1",
  "reportlab>=4.4,<5",
  "uharfbuzz>=0.39,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pypdf>=6,<7", "build>=1,<2"]

[project.scripts]
wualt-slm = "wualt_slm.cli:main"

[tool.setuptools.packages.find]
include = ["wualt_slm*"]

[tool.setuptools.package-data]
wualt_slm = ["assets/*.json", "assets/examples/*.json", "assets/web/*.html", "assets/web/*.css", "assets/web/*.js", "assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/fonts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
