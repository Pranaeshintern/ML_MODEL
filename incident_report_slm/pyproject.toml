[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wualt-incident-slm"
version = "0.20.0"
description = "Pretrained SLM wrapper for interpretation of backend distress signals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "uvicorn>=0.30,<1",
  "tzdata>=2025.1",
]

[project.scripts]
wualt-slm = "wualt_slm.cli:main"

[tool.setuptools.packages.find]
include = ["wualt_slm*"]

[tool.setuptools.package-data]
wualt_slm = ["assets/*.json", "assets/examples/*.json", "assets/web/*.html", "assets/web/*.css", "assets/web/*.js"]
